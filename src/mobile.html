<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minipad Next</title>
  <link rel="stylesheet" href="mobile.css">
  <script type="module" src="js/mobile.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <strong>Minipad Next</strong>
      <span id="status" role="status" aria-live="polite">初始化中…</span>
    </div>
    <button id="mode" class="mode" type="button" aria-pressed="false" disabled>阅读</button>
  </header>
  <nav class="notebooks" aria-label="笔记本与页面">
    <div class="chooser">
      <label for="book">笔记本</label>
      <select id="book" aria-label="选择笔记本"></select>
      <button id="add-book" type="button" aria-label="新建笔记本">＋</button>
    </div>
    <div class="chooser">
      <label for="note">页面</label>
      <select id="note" aria-label="选择页面"></select>
      <button id="add-note" type="button" aria-label="新建页面">＋</button>
    </div>
  </nav>
  <div id="toolbar" class="toolbar" role="toolbar" aria-label="文字格式">
    <button type="button" data-command="heading" aria-label="二级标题">H2</button>
    <button type="button" data-command="paragraph" aria-label="正文">正文</button>
    <button type="button" data-command="bold" aria-label="粗体"><b>B</b></button>
    <button type="button" data-command="italic" aria-label="斜体"><i>I</i></button>
    <button type="button" data-command="bullet" aria-label="无序列表">• 列表</button>
    <button type="button" data-command="ordered" aria-label="有序列表">1. 列表</button>
    <button type="button" data-command="quote" aria-label="引用">❞</button>
    <button type="button" data-command="inline-code" aria-label="行内代码">⌘</button>
    <button type="button" data-command="link" aria-label="添加链接">链接</button>
    <button type="button" data-command="image" aria-label="插入图片">图片</button>
    <button type="button" data-command="undo" aria-label="撤销">↶</button>
    <button type="button" data-command="redo" aria-label="重做">↷</button>
  </div>
  <main id="page" role="main" aria-label="笔记内容">
    <div id="editor" aria-label="Markdown 富文本编辑器"></div>
    <textarea id="source" aria-label="保真 Markdown 源码编辑" spellcheck="false" hidden></textarea>
  </main>
  <footer>
    <span id="hint">编辑内容自动保存在本机</span>
    <button id="refresh" type="button">重新读取</button>
  </footer>
  <input id="image-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/bmp" hidden>
</body>
</html>
