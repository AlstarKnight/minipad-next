<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minipad Next</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="bar" data-tauri-drag-region>
    <button id="btn-book" title="切换笔记本 (Ctrl+B)" aria-haspopup="true" aria-expanded="false"><span id="book-name">默认</span><svg viewBox="0 0 16 16"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></button>
    <div id="tabs" data-tauri-drag-region></div>
    <button id="btn-new" class="icon" title="新建页面 (Ctrl+T)">+</button>
    <div class="spacer" data-tauri-drag-region></div>
    <button id="btn-search" class="icon" title="搜索全部页面 (Ctrl+F)">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    </button>
    <button id="btn-mode" class="icon" title="编辑 / 阅读 (Ctrl+E)">
      <svg viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></svg>
    </button>
    <button id="btn-pin" class="icon" title="窗口置顶">
      <svg viewBox="0 0 16 16"><path d="M6 1.5h4M7 1.5v4L4.5 8.5h7L9 5.5v-4M8 8.5v6"/></svg>
    </button>
    <button id="btn-settings" class="icon" title="设置">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
    <button id="btn-hide" class="icon" title="隐藏 (Esc)">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>

  <main id="main">
    <textarea id="editor" spellcheck="false" placeholder="写点什么……"></textarea>
    <article id="preview" class="markdown" hidden></article>
  </main>

  <footer id="status">
    <span id="st-mode"></span>
    <span id="st-count"></span>
    <span class="spacer"></span>
    <span id="st-save"></span>
  </footer>

  <!-- 搜索 -->
  <div id="search" class="overlay" hidden>
    <div class="panel">
      <input id="search-input" type="text" placeholder="搜索全部页面……" autocomplete="off" />
      <div id="search-results"></div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settings" class="overlay" hidden>
    <div class="panel form">
      <h2>设置</h2>
      <label class="row">
        <span>呼出热键</span>
        <input id="set-hotkey" type="text" readonly placeholder="点这里然后按下组合键" />
      </label>
      <label class="row check"><input id="set-top" type="checkbox" /> <span>窗口总在最前</span></label>
      <label class="row check"><input id="set-edge" type="checkbox" /> <span>靠屏幕边缘时自动隐藏</span></label>
      <label class="row check"><input id="set-taskbar" type="checkbox" /> <span>在任务栏显示</span></label>
      <label class="row check"><input id="set-autostart" type="checkbox" /> <span>开机启动(启动后藏在托盘)</span></label>
      <label class="row">
        <span>外观</span>
        <select id="set-theme">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
      <label class="row">
        <span>字号</span>
        <input id="set-font" type="number" min="10" max="28" />
      </label>
      <div class="row col">
        <span>笔记文件夹(留空用默认位置;改了以后会读取新文件夹里的笔记,旧笔记不会自动搬过去)</span>
        <div class="inline">
          <input id="set-dir" type="text" spellcheck="false" />
          <button id="set-pick-dir" class="small">选择…</button>
        </div>
      </div>
      <div class="row">
        <button id="set-open-dir" class="link">打开笔记文件夹</button>
      </div>
      <h3>每日备份</h3>
      <label class="row check"><input id="set-backup" type="checkbox" /> <span>每天第一次保存时,把笔记文件夹备份成 zip</span></label>
      <label class="row"><span>保留份数</span><input id="set-backup-keep" type="number" min="1" max="365" /></label>
      <div class="row col">
        <span>备份位置(留空用默认位置)</span>
        <div class="inline"><input id="set-backup-dir" type="text" spellcheck="false" /><button id="set-pick-backup" class="small">选择…</button></div>
      </div>
      <div class="row"><span id="set-backup-info" class="muted"></span><button id="set-open-backup" class="link">打开备份文件夹</button></div>
      <p id="set-error" class="error" hidden></p>
      <div class="actions">
        <span class="about"><span id="set-version">Minipad Next</span> · <button id="set-repo" class="link">GitHub</button></span>
        <button id="set-cancel">取消</button>
        <button id="set-save" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认 / 输入名字的对话框 -->
  <div id="dialog" class="overlay center" hidden>
    <div class="panel form dialog">
      <p id="dialog-msg"></p>
      <input id="dialog-input" type="text" spellcheck="false" autocomplete="off" hidden />
      <div class="actions">
        <button id="dialog-cancel">取消</button>
        <button id="dialog-ok" class="primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 笔记本列表 -->
  <div id="books" class="menu books" hidden>
    <div id="books-title" class="menu-title">笔记本</div>
    <div id="books-list"></div>
    <hr />
    <button id="books-new">新建笔记本…</button>
    <div id="books-hint" class="menu-hint">右键笔记本可以改名或删除</div>
  </div>

  <!-- 右键菜单(内容由 openMenu 生成) -->
  <div id="ctx" class="menu" hidden></div>

  <div id="toast" hidden></div>

  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="vendor/highlight.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
