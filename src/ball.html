<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Minipad Next</title>
  <style>
    /* 窗口是透明的,只看得到图标本身 */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; }
    #ball {
      position: relative;
      width: var(--ball-size, 48px);
      height: var(--ball-size, 48px);
      cursor: pointer;
      isolation: isolate;
      filter: drop-shadow(0 2px 4px #0006);
      transition: transform .15s;
    }
    #ball:hover { transform: scale(1.08); }
    #ball:active { cursor: grabbing; }
    #ball img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
    #ball .tint {
      position: absolute;
      inset: 0;
      mix-blend-mode: color;
      -webkit-mask: var(--mask) center / contain no-repeat;
      mask: var(--mask) center / contain no-repeat;
      pointer-events: none;
    }
    #ball .tint[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="ball" title="点击打开悬浮笔记,按住可以拖动"><img alt="" /><div class="tint" hidden></div></div>
  <script type="module" src="js/ball.js"></script>
</body>
</html>
