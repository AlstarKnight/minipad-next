name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # 只取消 PR 里过时的构建;main 上的不取消,免得发布做到一半被下一次合并打断
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format and UI tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Rust 版本固定下来:缓存不会每 6 周失效一次,新版 clippy 的新规则也不会让无关的 PR 突然变红。
      # 升级 Rust 时把这里和下面 windows 里的版本号一起改,单独提一个 PR
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Check that the version numbers match
        run: node scripts/check-version.mjs

      - name: Check that CHANGELOG.md has this version
        run: node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test:ui

  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run build

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe src-tauri/target/release/minipad-next.exe

      - name: Collect files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 安装包的名字里带着打包时的版本号,和 package.json 对不上就失败
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_${version}_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { Get-ChildItem src-tauri/target/release/bundle/nsis; throw "找不到 $version 版的安装包" }
          Copy-Item $setup.FullName "dist/Minipad-Next-$version-setup.exe"
          Copy-Item src-tauri/target/release/minipad-next.exe "dist/Minipad-Next-$version-portable.exe"
          Get-ChildItem dist

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: minipad-next-windows
          path: dist/*.exe
          if-no-files-found: error

      # 只有安装版,测试时直接下这个
      - name: Upload setup
        uses: actions/upload-artifact@v6
        with:
          name: minipad-next-setup
          path: dist/*-setup.exe
          if-no-files-found: error

  # 发布单独放一个 job,等格式检查、界面测试和 Windows 构建都通过以后才发。
  # PR 里也跑一遍,只检查(能不能拿到安装包、CHANGELOG 里有没有这一节),不发布
  release:
    name: Release
    needs: [checks, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: minipad-next-windows
          path: dist

      # 合并到 main 时,如果 package.json 里的版本还没发布完(没有 Release,或者 Release 里缺安装包),
      # 就建标签 v版本号 并发布 Release(说明取自 CHANGELOG.md 里这个版本那一节)。
      # 上次发布到一半失败了(比如上传安装包时出错),重跑这次构建就会补上
      - name: Check whether this version is released
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.mjs "$version" > release-notes.md
          assets=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "$assets" -ge 2 ]; then
            echo "v$version 已经发布过"
          else
            echo "v$version 还没有发布(或者缺安装包),说明:"
            cat release-notes.md
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release for the new version
        if: steps.release.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          files: dist/*.exe
          fail_on_unmatched_files: true

      # 手动推了 v 开头的标签(或者在 Releases 页面新建了标签):把安装包附到这个 Release 上
      - name: Publish release for the pushed tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
