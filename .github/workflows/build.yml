name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # 只取消 PR 里过时的构建;main 上的不取消,免得发布做到一半被下一次合并打断
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format and UI tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Rust 版本固定下来:缓存不会每 6 周失效一次,新版 clippy 的新规则也不会让无关的 PR 突然变红。
      # 升级 Rust 时把这里和下面 rust / windows 里的版本号一起改,单独提一个 PR
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Check that the version numbers match
        run: node scripts/check-version.mjs

      - name: Check that CHANGELOG.md has this version
        run: node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps --only-shell chromium

      - name: UI tests
        run: npm run test:ui

      - name: Android frontend integration tests
        run: npm run test:mobile

      # 5000 页时的耗时,超过上限就失败;每次的数字在这次运行的摘要页里
      - name: Performance benchmark (5000 pages)
        run: npm run bench -- --check

  rust:
    name: Rust lint and unit tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy

      # 和打包任务分开缓存,避免并行任务互相覆盖 debug / release 依赖。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Lint
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe src-tauri/target/release/minipad-next.exe

      - name: Collect files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 安装包的名字里带着打包时的版本号,和 package.json 对不上就失败
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_${version}_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { Get-ChildItem src-tauri/target/release/bundle/nsis; throw "找不到 $version 版的安装包" }
          Copy-Item $setup.FullName "dist/Minipad-Next-$version-setup.exe"
          Copy-Item src-tauri/target/release/minipad-next.exe "dist/Minipad-Next-$version-portable.exe"
          Get-ChildItem dist

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: minipad-next-windows
          path: dist/*.exe
          if-no-files-found: error

      # 只有安装版,不打成 zip,测试时点开就是 exe(这一项的名字就是文件名)
      - name: Upload setup
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-setup.exe
          archive: false
          if-no-files-found: error

  # 先看这个版本要不要发布:只有合并到 main、而且这个版本还没发布完(没有 Release,或者 Release 里缺安装包)
  # 才需要,这时才去构建安卓安装包(耗时长),其余情况(PR、依赖更新合并等)都不用
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      # 数 Release 里的 Windows 安装包(.exe)。安卓安装包不算,所以以前发布过的版本不会因为没有 apk 被重新发布
      - name: Check whether this version is released
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          installers=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".exe"))] | length' 2>/dev/null || echo 0)
          if [ "$installers" -ge 2 ]; then
            echo "v$version 已经发布过"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "v$version 还没有发布(或者缺安装包)"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$version 还没有发布,但不是 main 上的构建,只检查不发布"
          fi

  # 安卓安装包只在要发布时构建,和 Release 一起发。没有配置固定签名密钥时跳过,不会用临时密钥签名发出去
  android:
    name: Android release APK
    needs: [plan]
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets: inherit

  # 发布单独放一个 job,等格式检查、界面测试、Rust 检查和 Windows 构建都通过以后才发。
  # PR 里也跑一遍,只检查(能不能拿到安装包、CHANGELOG 里有没有这一节),不发布
  release:
    name: Release
    needs: [checks, rust, windows, plan, android]
    # 安卓那一步在不需要发布时是跳过的,不能因此把发布拦住;它失败或被取消则不发
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.rust.result == 'success' && needs.windows.result == 'success' && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.android.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: minipad-next-windows
          path: dist

      # 安卓安装包没生成(没配签名密钥)时这里是空的,只发 Windows 的
      - uses: actions/download-artifact@v8
        if: needs.android.outputs.apk != ''
        with:
          name: ${{ needs.android.outputs.apk }}
          path: dist

      # 合并到 main 时,如果 package.json 里的版本还没发布完(没有 Release,或者 Release 里缺 Windows 安装包),
      # 就建标签 v版本号 并发布 Release(说明取自 CHANGELOG.md 里这个版本那一节)。
      # 上次发布到一半失败了(比如上传安装包时出错),重跑这次构建就会补上
      - name: Prepare release notes
        id: release
        run: |
          ls -l dist
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          node scripts/release-notes.mjs "$version" > release-notes.md
          echo "说明:"
          cat release-notes.md

      - name: Publish release for the new version
        if: needs.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true

      # 手动推了 v 开头的标签(或者在 Releases 页面新建了标签):把安装包附到这个 Release 上
      - name: Publish release for the pushed tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
