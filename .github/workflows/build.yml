name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run build

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe src-tauri/target/release/minipad-next.exe

      - name: Collect files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName "dist/Minipad-Next-$version-setup.exe"
          Copy-Item src-tauri/target/release/minipad-next.exe "dist/Minipad-Next-$version-portable.exe"
          Get-ChildItem dist

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: minipad-next-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
