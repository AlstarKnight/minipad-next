name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format and UI tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Check that CHANGELOG.md has this version
        run: node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test:ui

  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run build

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe src-tauri/target/release/minipad-next.exe

      - name: Collect files
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName "dist/Minipad-Next-$version-setup.exe"
          Copy-Item src-tauri/target/release/minipad-next.exe "dist/Minipad-Next-$version-portable.exe"
          Get-ChildItem dist

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: minipad-next-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true

      # 合并到 main 时,如果 package.json 里的版本还没有对应的 v 标签,
      # 就自动建标签并发布 Release(说明取自 CHANGELOG.md 里这个版本那一节)。
      - name: Check whether this version is released
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # --exit-code:找到标签返回 0,没有返回 2,其他是出错
          code=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || code=$?
          if [ "$code" = 0 ]; then
            echo "v$version 已经发布过,跳过"
          elif [ "$code" = 2 ]; then
            node scripts/release-notes.mjs "$version" > dist/release-notes.md
            cat dist/release-notes.md
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Publish release for the new version
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          body_path: dist/release-notes.md
          files: dist/*.exe
