name: Android prototype

on:
  # Only files that end up in the APK trigger a PR build; desktop-only code is excluded with '!'
  # (the last matching line wins). tests/android-paths.test.mjs checks this list against what the
  # Android build really compiles and bundles, and says which line to add when something is missing.
  pull_request:
    paths:
      - 'src-tauri/**'
      - '!src-tauri/src/desktop.rs'
      - '!src-tauri/src/backup.rs'
      - '!src-tauri/src/ball.rs'
      - '!src-tauri/src/edge.rs'
      - '!src-tauri/src/mini.rs'
      - '!src-tauri/src/minipad2.rs'
      - 'src/mobile*'
      - 'src/style.css'
      - 'src/js/**'
      - '!src/js/main.js'
      - '!src/js/ball.js'
      - '!src/js/search.js'
      - '!src/js/trash.js'
      - 'scripts/prepare.mjs'
      - 'scripts/prepare-mobile.mjs'
      - 'scripts/milkdown.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  # Called by build.yml when a version is about to be released (release: true). In that mode the
  # APK is only produced when the stable signing key is available, and gets a versioned name.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      apk:
        description: File name of the signed release APK ('' when it was skipped)
        value: ${{ jobs.android.outputs.apk }}

permissions:
  contents: read

# A newer push to the same PR replaces the running build instead of queueing a second one.
# Release builds on main are never cancelled, so a quick second merge cannot lose the first release.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      apk: ${{ steps.sign.outputs.apk }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check mobile frontend contents
        run: |
          npm run prepare-mobile
          node --check mobile-dist/js/mobile.js
          test "$(find mobile-dist -type f | wc -l)" -eq 5
          test -s mobile-dist/vendor/highlight.js
          test -s mobile-dist/desktop-editor.css
          du -ah mobile-dist
      - name: Generate Android project
        run: npm run tauri -- android init --ci
      - name: Build release APK
        run: npm run android:build
      # Release APKs are unsigned by default. With the four ANDROID_* repository secrets set, sign
      # with the stable key so a newer test APK installs over an older one. Without them, fall
      # back to a throw-away key so CI still produces an installable (but not upgradable) APK.
      # Passwords are only passed through environment variables, never printed.
      - name: Sign and verify installable APK
        id: sign
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk_dir=src-tauri/gen/android/app/build/outputs/apk
          unsigned="$(find "$apk_dir" -type f -iname '*release*unsigned*.apk' -print -quit)"
          if [[ -z "$unsigned" ]]; then
            echo "Expected an unsigned release APK under $apk_dir" >&2
            find "$apk_dir" -type f -name '*.apk' -print
            exit 1
          fi
          keystore="$RUNNER_TEMP/minipad-signing.jks"
          trap 'rm -f "$keystore"' EXIT
          set_count=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -n "${!name}" ]]; then set_count=$((set_count + 1)); fi
          done
          if (( set_count == 4 )); then
            mode="stable key (repository secrets)"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            keytool -list -keystore "$keystore" -alias "$KEY_ALIAS" \
              -storepass:env KEYSTORE_PASSWORD > /dev/null
          elif (( set_count == 0 )) && [[ "$RELEASE" == "true" ]]; then
            # A throw-away key must never end up on a public Release: nobody could update from it.
            msg="Release APK skipped: ANDROID_* repository secrets are not set, so it would only be signed with a temporary key. Set them and re-run the build to add the APK to the release."
            echo "::warning::$msg"
            echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          elif (( set_count == 0 )); then
            mode="temporary key (ANDROID_* secrets not set: this APK cannot be installed over another build)"
            KEYSTORE_PASSWORD=android KEY_PASSWORD=android KEY_ALIAS=minipad-test
            keytool -genkeypair -noprompt -keystore "$keystore" \
              -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Minipad Android CI Test, O=Minipad Next, C=US"
          else
            echo "Set all four secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) or none." >&2
            exit 1
          fi
          export KEYSTORE_PASSWORD KEY_PASSWORD
          mkdir -p android-artifacts
          apk=minipad-next-arm64-test.apk
          if [[ "$RELEASE" == "true" ]]; then
            apk="Minipad-Next-$(node -p "require('./package.json').version")-android-arm64.apk"
          fi
          out="android-artifacts/$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -P 16 4 \
            "$unsigned" "$RUNNER_TEMP/minipad-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$out" "$RUNNER_TEMP/minipad-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$out"
          ls -lh "$unsigned" "$out"
          stat -c 'APK bytes: %s' "$out"
          echo "APK signed with: $mode" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
      # Uploaded as-is (not zipped), so the link downloads the .apk itself.
      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.apk != ''
        with:
          path: android-artifacts/${{ steps.sign.outputs.apk }}
          archive: false
          if-no-files-found: error
