name: Android prototype

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/mobile*'
      - 'src/js/mobile.js'
      - 'scripts/prepare-mobile.mjs'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check mobile frontend contents
        run: |
          npm run prepare-mobile
          node --check mobile-dist/js/mobile.js
          test "$(find mobile-dist -type f | wc -l)" -eq 3
          test ! -e mobile-dist/vendor
          du -ah mobile-dist
      - name: Generate Android project
        run: npm run tauri -- android init --ci
      - name: Build release APK
        run: npm run android:build
      # Release APKs are unsigned by default. Sign the CI test copy with a
      # temporary key so users can install it; this is NOT a publishing key.
      - name: Sign and verify installable test APK
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=src-tauri/gen/android/app/build/outputs/apk
          unsigned="$(find "$apk_dir" -type f -iname '*release*unsigned*.apk' -print -quit)"
          if [[ -z "$unsigned" ]]; then
            echo "Expected an unsigned release APK under $apk_dir" >&2
            find "$apk_dir" -type f -name '*.apk' -print
            exit 1
          fi
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/minipad-ci.jks" \
            -storepass android -keypass android -alias minipad-test \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Minipad Android CI Test, O=Minipad Next, C=US"
          mkdir -p android-artifacts
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -P 16 4 \
            "$unsigned" "$RUNNER_TEMP/minipad-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/minipad-ci.jks" --ks-key-alias minipad-test \
            --ks-pass pass:android --key-pass pass:android \
            --out android-artifacts/minipad-next-arm64-test.apk \
            "$RUNNER_TEMP/minipad-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            android-artifacts/minipad-next-arm64-test.apk
          ls -lh "$unsigned" android-artifacts/minipad-next-arm64-test.apk
          stat -c 'APK bytes: %s' android-artifacts/minipad-next-arm64-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: minipad-next-android-prototype
          path: android-artifacts/minipad-next-arm64-test.apk
          if-no-files-found: error
