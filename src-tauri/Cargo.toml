[package]
name = "minipad-next"
version = "0.4.5"
description = "Minipad Next"
authors = ["AlstarKnight"]
repository = "https://github.com/AlstarKnight/minipad-next"
edition = "2021"

[lib]
name = "minipad_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
percent-encoding = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Tray, global shortcuts and desktop startup plugins are unavailable on Android.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
