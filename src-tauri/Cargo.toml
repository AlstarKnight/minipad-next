[package]
name = "minipad-next"
version = "0.5.4"
description = "Minipad Next"
authors = ["AlstarKnight"]
repository = "https://github.com/AlstarKnight/minipad-next"
edition = "2021"

[lib]
name = "minipad_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
quick-xml = "0.42"
# rustls 用 ring 做加密(webdav.rs 里装上),不用 reqwest 默认的 aws-lc:程序小约 0.8 MB,安卓 APK 和电脑安装包都跟着变小
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
# Same rustls as reqwest; tells certificate errors from other TLS failures and provides the ring crypto.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
sha2 = "0.10"
webpki-root-certs = "1.0.9"
percent-encoding = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# 打开网页链接:电脑上用系统浏览器,手机上用系统浏览器或应用内浏览器
tauri-plugin-opener = "2"

# Tray, global shortcuts and desktop startup plugins are unavailable on Android.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
# 每日备份打成 zip（backup.rs），只在电脑上用
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
